<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — {{ settings.school_name }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<style>
body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #1e1b4b; }
.login-card { background: #fff; padding: 36px; border-radius: 16px; width: 340px; box-shadow: 0 10px 40px rgba(0,0,0,.35); }
.login-logo { width: 56px; height: 56px; background: #6366f1; color: #fff; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 28px; margin-bottom: 14px; }
h1 { font-size: 20px; }
.login-sub { color: #64748b; font-size: 13px; margin-bottom: 18px; }
</style>
</head>
<body>
<div class="login-card">
  <div class="login-logo">🎓</div>
  <h1>{{ settings.school_name }}</h1>
  <p class="login-sub">School Fee Management System</p>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}
  {% endwith %}
  <form method="post">
    <label>Username</label>
    <input type="text" name="username" required autofocus>
    <label>Password</label>
    <input type="password" name="password" required>
    <br><br>
    <button class="btn btn-primary" style="width:100%; padding:10px;">Login</button>
  </form>
</div>
</body>
</html>
