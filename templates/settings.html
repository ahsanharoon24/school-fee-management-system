{% extends 'base.html' %}
{% block title %}Settings — {{ settings.school_name }}{% endblock %}
{% block content %}
<h1>⚙️ Settings</h1>
<div class="panel" style="max-width:600px;">
  <form method="post">
    <label>School Name *</label>
    <input type="text" name="school_name" value="{{ s.school_name }}" required>
    <label>Address</label>
    <input type="text" name="address" value="{{ s.address }}">
    <div class="form-row">
      <div><label>Phone</label><input type="text" name="phone" value="{{ s.phone }}"></div>
      <div><label>Email</label><input type="text" name="email" value="{{ s.email }}"></div>
    </div>
    <label>Late Fee (Rs.)</label>
    <input type="number" step="0.01" name="late_fee" value="{{ s.late_fee }}">
    <label>Bank Name</label>
    <input type="text" name="bank_name" value="{{ s.bank_name }}">
    <div class="form-row">
      <div><label>Account Title</label><input type="text" name="account_title" value="{{ s.account_title }}"></div>
      <div><label>Account Number</label><input type="text" name="account_number" value="{{ s.account_number }}"></div>
    </div>
    <label>Challan Footer</label>
    <input type="text" name="challan_footer" value="{{ s.challan_footer }}">
    <br><br>
    <button class="btn btn-primary">💾 Save</button>
  </form>
</div>
{% endblock %}
