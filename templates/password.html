{% extends 'base.html' %}
{% block title %}Change Password — {{ settings.school_name }}{% endblock %}
{% block content %}
<h1>🔑 Change Password</h1>
<div class="panel" style="max-width:400px;">
  <form method="post">
    <label>Old Password</label><input type="password" name="old_password" required>
    <label>New Password (min 6)</label><input type="password" name="new_password" required>
    <label>Confirm New Password</label><input type="password" name="confirm_password" required>
    <br><br>
    <button class="btn btn-primary">Change</button>
  </form>
</div>
{% endblock %}
